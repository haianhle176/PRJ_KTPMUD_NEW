name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore IoTPlatform.sln
      - run: dotnet build IoTPlatform.sln --configuration Release --no-restore
      - run: dotnet test IoTPlatform.sln --configuration Release --no-build
